{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center">
  <form method="post" action="/admin/login" class="bg-white shadow rounded p-6 w-full max-w-sm space-y-4">
    <h1 class="text-xl font-semibold">{{ restaurant_name() }} · Bot admin</h1>
    {% if error %}<p class="text-sm text-red-700 bg-red-50 p-2 rounded">{{ error }}</p>{% endif %}
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="block text-sm">Email<input name="email" type="email" required autocomplete="username" class="mt-1 w-full border rounded px-3 py-2"></label>
    <label class="block text-sm">Password<input name="password" type="password" required autocomplete="current-password" class="mt-1 w-full border rounded px-3 py-2"></label>
    <button class="w-full bg-slate-900 text-white rounded py-2">Log in</button>
  </form>
</div>
{% endblock %}
