{% extends "base.html" %}
{% block title %}Set password{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center">
  <form method="post" action="/admin/set-password/{{ token }}" class="bg-white shadow rounded p-6 w-full max-w-sm space-y-4">
    <h1 class="text-xl font-semibold">{% if purpose == "invite" %}Welcome! Choose a password{% else %}Reset your password{% endif %}</h1>
    {% if error %}<p class="text-sm text-red-700 bg-red-50 p-2 rounded">{{ error }}</p>{% endif %}
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label class="block text-sm">New password (12+ characters)<input name="new" type="password" required minlength="12" autocomplete="new-password" class="mt-1 w-full border rounded px-3 py-2"></label>
    <label class="block text-sm">Confirm<input name="confirm" type="password" required minlength="12" autocomplete="new-password" class="mt-1 w-full border rounded px-3 py-2"></label>
    <button class="w-full bg-slate-900 text-white rounded py-2">Set password</button>
  </form>
</div>
{% endblock %}
