{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center">
  <form method="post" action="/admin/password" class="bg-white shadow rounded p-6 w-full max-w-sm space-y-4">
    <h1 class="text-xl font-semibold">Change password</h1>
    {% if forced %}<p class="text-sm bg-amber-50 text-amber-900 p-2 rounded">You must change your password before continuing.</p>{% endif %}
    {% if error %}<p class="text-sm text-red-700 bg-red-50 p-2 rounded">{{ error }}</p>{% endif %}
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label class="block text-sm">Current password<input name="current" type="password" required autocomplete="current-password" class="mt-1 w-full border rounded px-3 py-2"></label>
    <label class="block text-sm">New password (12+ characters)<input name="new" type="password" required minlength="12" autocomplete="new-password" class="mt-1 w-full border rounded px-3 py-2"></label>
    <label class="block text-sm">Confirm new password<input name="confirm" type="password" required minlength="12" autocomplete="new-password" class="mt-1 w-full border rounded px-3 py-2"></label>
    <button class="w-full bg-slate-900 text-white rounded py-2">Save</button>
    {% if not forced %}<a href="/admin/" class="block text-center text-sm underline">Cancel</a>{% endif %}
  </form>
</div>
{% endblock %}
